 <!-- Perhitungan Lebar kartu:
        320px + 40px (padding) + 4 px (border) = 364px -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Project</title>
    <style>
       * {
        box-sizing: border-box;
       }
       body{
        margin: 0;
        background-color: #f4f4f4;
        font-family: Arial, sans-serif;
       }
       .card {
        width: 320px;
        padding: 20px;
        border: 2px solid black;
        margin: 30px auto;
       }

       .card img {
        width: 100%;
        height: 160px;
        display: block;
       }

       .card h3 {
        color: #333;
        margin-bottom: 8px;
       }
       .card p {
        font-size: 15px;
       } 
       .card a{
        color: blue ;
       }
       footer{
        text-align: center;
       }
       
       
    </style>
</head>
<body>
    <main>
        <div class="card">
            <img src="../assets/images/hobi-gaming.jpg" alt="Hobi Alexis">

            <h3>Hobi Gaming</h3>
            <p>Bermain game merupakan kegiatan yang membuat saya lebih rileks.
                Saya suka bermain bersama teman untuk mengisi waktu luang sebagai hiburan.</p>

                <a href="#">Lihat Proyek</a>
        </div>
         <footer>
                <a href="../index.html">Kembali Ke Beranda</a>
        </footer>
    </main>
</body>
</html>
